# ==============================================================================
# miqulock Configuration File
# Modern Wayland Session Locker for Miquland
# ==============================================================================

# ==============================================================================
# Section 1: Lock Screen Options
# ==============================================================================
time_format = %H:%M
date_format = %A, %B %d
show_power_actions = true

# Background: accepts a solid color (hex), an image file path, or a pointer file
# (a plain text file whose first line contains the real image path).
# When unset, defaults to color_primary.
# background = #1e1e2e
# background = /path/to/wallpaper.jpg
background = ~/.config/theme/current/wallpaper

# Background Blur & Dimming:
# blur: Gaussian-approximated blur radius (0 = disabled, e.g. 25 for smooth frosted glass)
# dim: darkening overlay opacity between 0.0 (no dimming) and 1.0 (completely dark)
blur = 25
dim = 0.25

# ==============================================================================
# Section 2: Toolkit Appearance Overrides (Optional)
#
# The following settings are inherited automatically from:
#   ~/.config/miqutoolkit/miqutoolkit.conf  (user toolkit config)
#   /usr/share/miqutoolkit/miqutoolkit.conf (system toolkit defaults)
#
# Uncomment any setting below to override it for miqulock only.
# Leave commented to inherit from miqutoolkit.
# ==============================================================================
# font = Sans
# font_size = 11
# corner_radius = 12
# border_width = 1
# icon_theme = Papirus
#
# --- Custom Palette Overrides ---
# primary = #6366f1
# on_primary = #ffffff
# primary_container = #e0e7ff
# background = #f7f7fc
# surface = #ffffff
# on_surface = #1a1a2e
# outline = #d5d8ea
# error = #ef4444
