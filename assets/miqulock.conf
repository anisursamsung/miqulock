# ==============================================================================
# miqulock Configuration File
# Modern Wayland Session Locker for Miquland
# ==============================================================================

# Dynamic Theme Import (optional):
# include = ~/.config/theme/current/miqudesk.colors

[general]
# Typography
font = Sans
time_format = %H:%M
date_format = %A, %B %d

# Geometry & Borders
corner_radius = 24

# ==============================================================================
# Colors (Hex: #RRGGBB or #RRGGBBAA)
# ==============================================================================
primary = #0066ff
on_primary = #ffffff
primary_container = #cce5ff
background = #0b0f19
surface = #161f30
on_surface = #f8fafc
outline = #3b82f6
error = #ef4444
