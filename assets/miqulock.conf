# ==============================================================================
# miqulock Configuration File
# Modern Wayland Session Locker for Miquland
# ==============================================================================

# Dynamic Theme Import (optional):
# include = ~/.config/theme/current/miqudesk.colors

[general]
# Typography
font = Sans
time_format = %H:%M
date_format = %A, %B %d

# Geometry & Borders
corner_radius = 24

# ==============================================================================
# Colors (Hex: #RRGGBB or #RRGGBBAA)
# By default, miqulock automatically inherits your unified palette from miqutoolkit
# (~/.config/miqutoolkit/miqutoolkit.conf or /usr/share/miqutoolkit/miqutoolkit.conf).
# Uncomment and edit any line below if you wish to override colors specifically for lock screen:
# ==============================================================================
# primary = #6366f1
# on_primary = #ffffff
# primary_container = #e0e7ff
# background = #f7f7fc
# surface = #ffffff
# on_surface = #1a1a2e
# outline = #d5d8ea
# error = #ef4444
